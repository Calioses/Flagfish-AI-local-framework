sync_interval: 60
chroma_path: './chroma_db'
sqlite_path: './sitemap.db'
embedding_model: 'all-MiniLM-L6-v2'

# Extensions to parse
indexed_extensions:
  - '.py'
  - '.go'
  - '.sql'
  - '.md'
  - '.txt'
  - '.json'
  - '.cpp'
  - '.h'
  - '.c'
  - '.rs'
  - '.ts'
  - '.js'

# Directory names/patterns to skip during traversals
ignored_directories:
  - '.git'
  - '__pycache__'
  - 'node_modules'
  - '.venv'
  - 'venv'
  - 'dist'
  - 'build'
  - '.idea'
  - '.vscode'

ollama:
  url: 'http://localhost:11434/api/chat'
  model: 'qwen3.5-coder:9b'

discord_tokens:
  - 'YOUR_DISCORD_BOT_TOKEN_1'

git_repos:
  - '/home/user/projects/algorithm-core'

local_paths:
  - '/home/user/Documents/papers'
